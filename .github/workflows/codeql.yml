name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so a newly published rule finds existing code without waiting for the next push.
    - cron: "31 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Setup .NET SDK
        # Install both SDKs and let global.json pick: setup-dotnet resolving the pinned preview from
        # global.json alone left the runner on its preinstalled 10.0.x, which cannot target net11.0.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: csharp
          build-mode: manual

      # Manual build mode: the autobuilder does not know about the pinned preview SDK or the
      # solution layout, and a build it cannot complete yields no analysis at all.
      - name: Build solution
        run: dotnet build ObsWebSocket.sln --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:csharp"
